name: Habun pull request OIDC inspection

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    if: >-
      github.repository == 'pubgsufian-afk/z.B.-mein-projekt' &&
      github.actor_id == '249184348' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.title == 'Run schedule worker fallback'
    runs-on: ubuntu-latest
    steps:
      - name: Print safe OIDC routing claims
        run: |
          node --input-type=module <<'NODE'
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL)
          url.searchParams.set('audience', 'habun-schedule-assistant')
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          })
          if (!response.ok) throw new Error(`OIDC request failed ${response.status}`)
          const { value } = await response.json()
          const payload = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString('utf8'))
          const safe = {
            repository: payload.repository,
            repository_id: payload.repository_id,
            repository_owner_id: payload.repository_owner_id,
            actor_id: payload.actor_id,
            event_name: payload.event_name,
            ref: payload.ref,
            sub: payload.sub,
            workflow_ref: payload.workflow_ref,
          }
          console.log(JSON.stringify(safe))
          NODE
