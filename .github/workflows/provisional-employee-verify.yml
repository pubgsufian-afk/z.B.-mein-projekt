name: Provisional employee verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provisional-employee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --experimental-strip-types scripts/schedule-provisional-employee-test.mjs
      - run: node scripts/schedule-assistant-source-test.mjs
      - run: node scripts/schedule-assistant-management-source-test.mjs
