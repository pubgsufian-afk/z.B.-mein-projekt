name: Reconstruct repaired Habun main portal

on:
  push:
    branches:
      - repair-main-20260731

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: repair-main-20260731
          fetch-depth: 0

      - name: Reconstruct and validate repaired source
        run: bash repair/reconstruct.sh

      - name: Commit complete repaired source
        run: |
          git config user.name "Habun Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Reconstruct repaired Habun main portal"
          git push origin HEAD:repair-main-20260731
