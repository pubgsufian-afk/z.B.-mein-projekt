name: Timesheet feature TDD

on:
  push:
    branches:
      - feat/timesheet-pdf-mobile-edit-20260812

permissions:
  contents: read

jobs:
  targeted-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/timesheet-suppression-schema-test.mjs
      - run: node scripts/timesheet-suppression-repository-source-test.mjs
      - run: node scripts/timesheet-delete-restore-api-source-test.mjs
      - run: node scripts/timesheet-monthly-pdf-layout-source-test.mjs
      - run: node scripts/timesheet-mobile-edit-source-test.mjs
      - run: node scripts/timesheet-restore-ui-source-test.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
