name: Timesheet feature TDD

on:
  push:
    branches:
      - feat/timesheet-pdf-mobile-edit-20260812

permissions:
  contents: read

jobs:
  targeted-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/timesheet-suppression-schema-test.mjs
      - run: node scripts/timesheet-suppression-repository-source-test.mjs
      - run: node scripts/timesheet-delete-restore-api-source-test.mjs
