name: Unified portal verification

on:
  push:
    branches:
      - work/attendance-v2-complete
      - fix/unified-portal-mobile-settings
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply protected report query correction
        run: node scripts/apply-report-query-fix.mjs
      - run: npm run verify
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload corrected report sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-report-sources
          path: |
            netlify/functions/unified-reports.mts
            netlify/functions/reports-v2.mts
          if-no-files-found: error
          retention-days: 2
      - name: Upload unified portal preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-portal-preview
          path: |
            artifacts/unified-preview
            public/habun-logo.png
          if-no-files-found: error
          retention-days: 7
