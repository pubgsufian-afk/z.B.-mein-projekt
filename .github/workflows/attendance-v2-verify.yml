name: Unified portal verification

on:
  push:
    branches:
      - work/attendance-v2-complete
      - fix/unified-portal-mobile-settings
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source for Netlify
        run: git archive --format=zip --output=/tmp/habun-netlify-source.zip HEAD
      - name: Upload Netlify source archive
        uses: actions/upload-artifact@v4
        with:
          name: habun-netlify-source
          path: /tmp/habun-netlify-source.zip
          if-no-files-found: error
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload unified portal preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-portal-preview
          path: |
            artifacts/unified-preview
            public/habun-logo.png
            test-results
          if-no-files-found: error
          retention-days: 7
