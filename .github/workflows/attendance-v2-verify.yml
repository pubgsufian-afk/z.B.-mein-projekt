name: Unified portal verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - run: npm run build
      - name: Bundle Netlify functions locally
        run: npx -y netlify-cli@latest functions:build --src netlify/functions --functions .netlify/functions-build --debug
