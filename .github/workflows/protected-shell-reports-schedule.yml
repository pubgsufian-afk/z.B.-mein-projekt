name: Protected shell-only reports and schedule verification

on:
  pull_request:
    branches:
      - fix-reports-live

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_BRANCH: fix-reports-live-final-check-run
    steps:
      - name: Clone protected branch without external actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repository
          cd repository
          git checkout "${TARGET_BRANCH}"
          git config user.name "habun-portal-bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Select Node 22
        shell: bash
        run: |
          set -euo pipefail
          source "$NVM_DIR/nvm.sh"
          nvm use 22
          node --version
      - name: Recreate and apply protected implementation
        shell: bash
        run: |
          set -euo pipefail
          source "$NVM_DIR/nvm.sh"
          nvm use 22
          cd repository
          cat scripts/.reports-schedule-apply-00.b64 scripts/.reports-schedule-apply-01.b64 scripts/.reports-schedule-apply-02.b64 scripts/.reports-schedule-apply-03.b64 | base64 -d | gunzip > /tmp/apply-reports-schedule-mobile.mjs
          node --check /tmp/apply-reports-schedule-mobile.mjs
          node /tmp/apply-reports-schedule-mobile.mjs
      - name: Install and verify all source contracts
        shell: bash
        run: |
          set -euo pipefail
          source "$NVM_DIR/nvm.sh"
          nvm use 22
          cd repository
          npm install --no-audit --no-fund
          npm run verify
      - name: Build production bundle
        shell: bash
        run: |
          set -euo pipefail
          source "$NVM_DIR/nvm.sh"
          nvm use 22
          cd repository
          npm run build
      - name: Verify desktop iPhone and Android browser flows
        shell: bash
        run: |
          set -euo pipefail
          source "$NVM_DIR/nvm.sh"
          nvm use 22
          cd repository
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Commit only after every verification passed
        shell: bash
        run: |
          set -euo pipefail
          cd repository
          rm -f scripts/.reports-schedule-apply-*.b64
          rm -f .github/workflows/apply-reports-schedule-mobile.yml
          git add -A
          git commit -m "feat: repair reports and compact schedule [verified]"
          git push origin HEAD:"${TARGET_BRANCH}"
