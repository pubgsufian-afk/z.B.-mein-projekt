name: Full portal audit

on:
  push:
    branches:
      - audit/full-portal-20260806
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify source and API contracts
        run: npm run verify
      - name: Build production bundle
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser tests
        run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-portal-audit-evidence
          path: |
            artifacts/unified-preview
            test-results
          if-no-files-found: warn
          retention-days: 7
