name: Full portal audit

on:
  push:
    branches:
      - audit/full-portal-20260806
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-portal-20260806
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run and record the full audit
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/audit-logs docs/audits

          npm run verify 2>&1 | tee artifacts/audit-logs/verify.log
          VERIFY_STATUS=${PIPESTATUS[0]}

          BUILD_STATUS=99
          BROWSER_STATUS=99
          if [ "$VERIFY_STATUS" -eq 0 ]; then
            npm run build 2>&1 | tee artifacts/audit-logs/build.log
            BUILD_STATUS=${PIPESTATUS[0]}
          fi
          if [ "$VERIFY_STATUS" -eq 0 ] && [ "$BUILD_STATUS" -eq 0 ]; then
            npx playwright install --with-deps chromium 2>&1 | tee artifacts/audit-logs/browser-install.log
            INSTALL_STATUS=${PIPESTATUS[0]}
            if [ "$INSTALL_STATUS" -eq 0 ]; then
              npm run test:e2e 2>&1 | tee artifacts/audit-logs/browser.log
              BROWSER_STATUS=${PIPESTATUS[0]}
            else
              BROWSER_STATUS=$INSTALL_STATUS
            fi
          fi

          RESULT=fehlgeschlagen
          if [ "$VERIFY_STATUS" -eq 0 ] && [ "$BUILD_STATUS" -eq 0 ] && [ "$BROWSER_STATUS" -eq 0 ]; then
            RESULT=erfolgreich
          fi

          {
            echo '# Automatische Gesamtprüfung'
            echo
            echo "Ergebnis: $RESULT"
            echo
            echo "- Quell- und API-Prüfung: $VERIFY_STATUS"
            echo "- Produktions-Build: $BUILD_STATUS"
            echo "- Browserprüfung Desktop/iPhone/Android: $BROWSER_STATUS"
            echo '- Hauptseite wurde nicht veröffentlicht oder verändert.'
            echo
            echo '## Letzte Prüfausgabe'
            echo '```text'
            tail -n 120 artifacts/audit-logs/verify.log 2>/dev/null || true
            tail -n 80 artifacts/audit-logs/build.log 2>/dev/null || true
            tail -n 80 artifacts/audit-logs/browser.log 2>/dev/null || true
            echo '```'
          } > docs/audits/automated-verification.md

          git config user.name 'habun-portal-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/audits/automated-verification.md
          if [ "$RESULT" = 'erfolgreich' ]; then
            git add frontend/src/App.jsx netlify/functions/_shared/portal-role.mts netlify/functions/session.mts netlify/functions/schedule-v2.mts netlify/functions/schedule-assist-v2.mts tests/e2e/unified-portal.spec.mjs public/assets
          fi
          if ! git diff --cached --quiet; then
            git commit -m "test: Portalprüfung $RESULT"
            git push origin HEAD:audit/full-portal-20260806
          fi

          if [ "$RESULT" != 'erfolgreich' ]; then exit 1; fi
      - name: Upload browser and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-portal-audit-evidence
          path: |
            artifacts/audit-logs
            artifacts/unified-preview
            test-results
          if-no-files-found: warn
          retention-days: 7
