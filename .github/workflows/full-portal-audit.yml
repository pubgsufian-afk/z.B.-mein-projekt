name: Full portal audit

on:
  push:
    branches:
      - audit/full-portal-20260806
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-portal-20260806
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify source and API contracts
        run: npm run verify
      - name: Build production bundle
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser tests
        run: npm run test:e2e
      - name: Record verified source
        run: |
          cat > docs/audits/automated-verification.md <<'REPORT'
          # Automatische Gesamtprüfung

          Ergebnis: erfolgreich

          - Quell- und Rollenprüfungen bestanden
          - API- und Datenbankverträge bestanden
          - Produktions-Build bestanden
          - PDF- und Excel-Verträge bestanden
          - Dienstplan-Support-Rechte bestanden
          - Browserprüfung auf Desktop, iPhone und Android bestanden
          - Keine Veröffentlichung auf der Hauptseite
          REPORT
          git config user.name "habun-portal-audit"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/App.jsx netlify/functions/_shared/portal-role.mts netlify/functions/session.mts netlify/functions/schedule-v2.mts netlify/functions/schedule-assist-v2.mts tests/e2e/unified-portal.spec.mjs public/assets docs/audits/automated-verification.md
          if ! git diff --cached --quiet; then
            git commit -m "test: vollständigen Portalstand automatisch verifizieren"
            git push origin HEAD:audit/full-portal-20260806
          fi
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-portal-audit-evidence
          path: |
            artifacts/unified-preview
            test-results
          if-no-files-found: warn
          retention-days: 7
