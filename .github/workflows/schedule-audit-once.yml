# trigger 2026-08-18T21:09+02:00
name: Habun one-time encrypted schedule audit

on:
  push:
    paths:
      - '.github/workflows/schedule-audit-once.yml'

permissions:
  contents: write
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Query encrypted schedule result
        env:
          ENVELOPE: '{"version":1,"state":"command","algorithm":"RSA-OAEP-256+A256GCM","encryptedKey":"","iv":"sMm0RxdrbJbrM1TK","ciphertext":"","tag":"+wLjY276o0X1oZQHbzjMFA=="}'
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const oidcUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL)
          oidcUrl.searchParams.set('audience', 'habun-schedule-assistant')
          const oidcRes = await fetch(oidcUrl, { headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } })
          if (!oidcRes.ok) throw new Error(`OIDC ${oidcRes.status}`)
          const { value: oidcToken } = await oidcRes.json()
          const relayRes = await fetch('https://habun-mitarbeiterportal.netlify.app/api/schedule-oidc-trigger', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
            body: JSON.stringify({ oidcToken, envelope: JSON.parse(process.env.ENVELOPE) }),
          })
          const relay = await relayRes.json()
          if (!relayRes.ok) throw new Error(`Relay ${relayRes.status}: ${JSON.stringify(relay)}`)
          if (!relay.encryptedResult) throw new Error('No encryptedResult')
          const path = 'ops/schedule-audit-result.json'
          const body = {
            message: 'chore: store encrypted schedule audit result [skip ci]',
            content: Buffer.from(JSON.stringify(relay.encryptedResult)).toString('base64'),
          }
          const current = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/contents/${path}`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
          })
          if (current.ok) body.sha = (await current.json()).sha
          const writeRes = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/contents/${path}`, {
            method: 'PUT',
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
            },
            body: JSON.stringify(body),
          })
          if (!writeRes.ok) throw new Error(`Write ${writeRes.status}: ${await writeRes.text()}`)
          NODE
