name: Instant portal data red-green check

on:
  push:
    branches:
      - perf/instant-portal-data

permissions:
  contents: read

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/display-snapshots-test.mjs
      - run: node scripts/apply-instant-portal-data-performance.mjs
      - run: node scripts/admin-overview-performance-test.mjs
