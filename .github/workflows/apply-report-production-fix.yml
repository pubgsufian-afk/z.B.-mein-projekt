name: Protected report production fix

on:
  push:
    branches:
      - fix/reports-production-db-and-pdf-logo

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reports-production-db-and-pdf-logo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Write regression tests first
        run: node scripts/apply-report-production-fix.mjs tests
      - name: Confirm regression test fails before fix
        shell: bash
        run: |
          if node scripts/report-production-regression-test.mjs; then
            echo "Regression test unexpectedly passed before the fix."
            exit 1
          fi
          echo "Expected failing regression test confirmed."
      - name: Apply database, filter and PDF logo fix
        run: node scripts/apply-report-production-fix.mjs fix
      - name: Confirm regression test passes after fix
        run: node scripts/report-production-regression-test.mjs
      - name: Run complete source verification
        run: npm run verify
      - name: Build production bundle
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run desktop, iPhone and Android verification
        run: npm run test:e2e
      - name: Remove one-time workflow files
        run: node scripts/apply-report-production-fix.mjs cleanup
      - name: Commit only verified changes
        run: |
          git config user.name "habun-portal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: use production database for reports and center PDF logo [verified]"
          git push origin HEAD:fix/reports-production-db-and-pdf-logo
      - name: Upload mobile verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-production-fix-preview
          path: artifacts/unified-preview
          if-no-files-found: warn
          retention-days: 7
