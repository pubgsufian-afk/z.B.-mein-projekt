name: Source bundle once

on:
  push:
    branches:
      - ops/source-bundle-20260901

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Upload repository source
        uses: actions/upload-artifact@v4
        with:
          name: habun-source-e8371949
          path: |
            .
            !.git/**
            !node_modules/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
