name: Habun schedule OIDC relay

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  publish:
    if: >-
      github.repository == 'pubgsufian-afk/z.B.-mein-projekt' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 73 &&
      github.actor_id == '249184348' &&
      startsWith(github.event.comment.body, '<!-- habun-schedule-envelope-v1 -->')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/run-schedule-oidc-relay.mjs
        env:
          SCHEDULE_ENVELOPE_COMMENT: ${{ github.event.comment.body }}
          SCHEDULE_ENCRYPTED_RESULT_PATH: ${{ runner.temp }}/habun-schedule-result.json
      - name: Return encrypted result to relay thread
        if: always()
        env:
          GITHUB_RELAY_TOKEN: ${{ github.token }}
          RESULT_PATH: ${{ runner.temp }}/habun-schedule-result.json
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          let raw = ''
          try {
            raw = (await readFile(process.env.RESULT_PATH, 'utf8')).trim()
          } catch {
            process.exit(0)
          }
          if (!raw || raw.length > 60000) process.exit(0)
          const parsed = JSON.parse(raw)
          if (parsed?.version !== 1 || parsed?.algorithm !== 'A256GCM') process.exit(0)
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues/73/comments`, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.GITHUB_RELAY_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'Content-Type': 'application/json',
              'User-Agent': 'habun-schedule-encrypted-result',
              'X-GitHub-Api-Version': '2022-11-28',
            },
            body: JSON.stringify({ body: `<!-- habun-schedule-result-v1 -->\n${raw}` }),
          })
          if (!response.ok) throw new Error(`Encrypted result comment failed ${response.status}`)
          NODE
      - name: Upload encrypted schedule result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: habun-schedule-encrypted-result
          path: ${{ runner.temp }}/habun-schedule-result.json
          if-no-files-found: ignore
          retention-days: 1
