name: Habun schedule OIDC relay

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  statuses: write

jobs:
  publish:
    if: >-
      github.repository == 'pubgsufian-afk/z.B.-mein-projekt' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 73 &&
      github.event.comment.user.id == 249184348 &&
      startsWith(github.event.comment.body, '<!-- habun-schedule-envelope-v1 -->')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run encrypted schedule relay
        id: relay
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/run-schedule-oidc-relay.mjs >"$RUNNER_TEMP/habun-schedule-relay.log" 2>&1
          code=$?
          set -e
          summary="$(grep -E '^Habun schedule OIDC relay: employees=' "$RUNNER_TEMP/habun-schedule-relay.log" | tail -n 1 || true)"
          if [ -z "$summary" ]; then
            summary="$(grep -E 'Habun schedule relay failed|GitHub OIDC token request failed|GitHub OIDC token response is empty|Ungültiger Dienstplan-Envelope|Command ist abgelaufen|fehlt$' "$RUNNER_TEMP/habun-schedule-relay.log" | tail -n 1 || true)"
          fi
          if [ -z "$summary" ]; then
            summary="relay exited with code $code"
          fi
          summary="${summary#Habun schedule OIDC relay: }"
          summary="$(printf '%s' "$summary" | tr '\r\n' ' ' | cut -c1-120)"
          printf 'exit_code=%s\n' "$code" >> "$GITHUB_OUTPUT"
          printf 'summary=%s\n' "$summary" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/habun-schedule-relay.log"
          exit "$code"
        env:
          SCHEDULE_ENVELOPE_COMMENT: ${{ github.event.comment.body }}
          SCHEDULE_ENCRYPTED_RESULT_PATH: ${{ runner.temp }}/habun-schedule-result.json
      - name: Publish safe relay status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY_OUTCOME: ${{ steps.relay.outcome }}
          RELAY_SUMMARY: ${{ steps.relay.outputs.summary }}
        run: |
          node --input-type=module <<'NODE'
          const state = process.env.RELAY_OUTCOME === 'success' ? 'success' : 'failure'
          const description = String(process.env.RELAY_SUMMARY || (state === 'success' ? 'schedule relay completed' : 'schedule relay failed'))
            .replace(/[\r\n\t]+/g, ' ')
            .replace(/\s+/g, ' ')
            .trim()
            .slice(0, 140)
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
            },
            body: JSON.stringify({ state, context: 'habun/schedule-relay', description }),
          })
          if (!response.ok) throw new Error(`status write failed ${response.status}`)
          NODE
      - name: Upload encrypted schedule result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: habun-schedule-encrypted-result
          path: ${{ runner.temp }}/habun-schedule-result.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Fail relay job when processing failed
        if: steps.relay.outcome != 'success'
        run: exit 1
