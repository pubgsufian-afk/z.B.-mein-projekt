name: Habun schedule OIDC relay

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: >-
      github.repository == 'pubgsufian-afk/z.B.-mein-projekt' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 73 &&
      github.actor_id == '249184348' &&
      startsWith(github.event.comment.body, '<!-- habun-schedule-envelope-v1 -->')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/run-schedule-oidc-relay.mjs
        env:
          SCHEDULE_ENVELOPE_COMMENT: ${{ github.event.comment.body }}
          SCHEDULE_ENCRYPTED_RESULT_PATH: ${{ runner.temp }}/habun-schedule-result.json
      - name: Persist encrypted audit result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_PATH: ${{ runner.temp }}/habun-schedule-result.json
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          const encrypted = (await readFile(process.env.RESULT_PATH, 'utf8')).trim()
          if (!encrypted) process.exit(0)
          const chunks = encrypted.match(/.{1,1800}/g) || []
          const wrapped = chunks.join('\n') + '\n'
          const path = 'ops/schedule-audit-result.txt'
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json',
            'X-GitHub-Api-Version': '2022-11-28',
          }
          const existing = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/contents/${path}`, { headers })
          const body = {
            message: 'chore: store encrypted schedule audit result [skip ci]',
            content: Buffer.from(wrapped).toString('base64'),
          }
          if (existing.ok) body.sha = (await existing.json()).sha
          const written = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/contents/${path}`, {
            method: 'PUT', headers, body: JSON.stringify(body),
          })
          if (!written.ok) throw new Error(`write failed ${written.status}: ${await written.text()}`)
          NODE
      - name: Upload encrypted schedule result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: habun-schedule-encrypted-result
          path: ${{ runner.temp }}/habun-schedule-result.json
          if-no-files-found: ignore
          retention-days: 1
