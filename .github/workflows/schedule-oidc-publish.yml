name: Habun schedule OIDC relay

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: >-
      github.repository == 'pubgsufian-afk/z.B.-mein-projekt' &&
      github.event.pull_request.number == 73 &&
      github.actor_id == '249184348' &&
      github.event.pull_request.head.ref == 'ops/schedule-relay' &&
      github.event.pull_request.head.repo.id == 1184469401 &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/run-schedule-oidc-relay.mjs
        env:
          SCHEDULE_ENVELOPE_REF: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
          GITHUB_RELAY_TOKEN: ${{ github.token }}
