name: Habun schedule OIDC relay

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  publish:
    if: >-
      github.repository == 'pubgsufian-afk/z.B.-mein-projekt' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 73 &&
      github.actor_id == '249184348' &&
      startsWith(github.event.comment.body, '<!-- habun-schedule-envelope-v1 -->')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/run-schedule-oidc-relay.mjs
        env:
          SCHEDULE_ENVELOPE_COMMENT: ${{ github.event.comment.body }}
          SCHEDULE_ENCRYPTED_RESULT_PATH: ${{ runner.temp }}/habun-schedule-result.json
      - name: Return encrypted schedule result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_PATH: ${{ runner.temp }}/habun-schedule-result.json
          COMMENT_ID: ${{ github.event.comment.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          const path = String(process.env.RESULT_PATH || '')
          let encryptedResult = ''
          try { encryptedResult = (await readFile(path, 'utf8')).trim() } catch {}
          if (!encryptedResult) process.exit(0)
          const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/issues/comments/${process.env.COMMENT_ID}`, {
            method: 'PATCH',
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
            },
            body: JSON.stringify({ body: `<!-- habun-schedule-result-v1 -->\n${encryptedResult}` }),
          })
          if (!response.ok) throw new Error(`Encrypted result callback failed (${response.status})`)
          NODE
      - name: Upload encrypted schedule result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: habun-schedule-encrypted-result
          path: ${{ runner.temp }}/habun-schedule-result.json
          if-no-files-found: ignore
          retention-days: 1
