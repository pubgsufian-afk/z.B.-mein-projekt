name: Portal admin full verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'netlify/functions/**'
      - 'public/**'
      - 'frontend/src/**'
      - 'ops/portal-admin-*.json'
      - 'scripts/portal-admin-*.mjs'
      - 'scripts/verify-portal-admin-full.mjs'
      - 'scripts/run-schedule-oidc-relay.mjs'
      - '.github/workflows/schedule-oidc-publish.yml'
      - '.github/workflows/portal-admin-full-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Existing portal regression suite
        run: npm run verify
      - name: Full encrypted portal admin verification
        run: node scripts/verify-portal-admin-full.mjs
