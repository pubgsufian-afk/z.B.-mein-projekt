name: Temporary source export

on:
  push:
    branches:
      - fix/safe-schedule-name-resolution

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: tar --exclude=.git -czf /tmp/habun-source.tar.gz .
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: habun-source-temp
          path: /tmp/habun-source.tar.gz
          retention-days: 1
          if-no-files-found: error
