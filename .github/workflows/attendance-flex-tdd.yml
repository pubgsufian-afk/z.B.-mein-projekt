name: Attendance flex TDD

on:
  push:
    branches:
      - feat/attendance-refresh-auto-checkout-20260817

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --experimental-strip-types scripts/attendance-flex-clock-test.mjs
