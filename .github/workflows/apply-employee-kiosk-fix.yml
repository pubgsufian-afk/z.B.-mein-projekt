name: Apply employee kiosk refactor

on:
  push:
    branches:
      - fix/runtime-database-connection

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[employee-kiosk-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-database-connection
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply refactor
        run: node scripts/apply-employee-kiosk-fix.mjs
      - name: Commit generated source changes
        run: |
          git config user.name "habun-portal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/App.jsx frontend/src/styles.css netlify/functions/_shared/attendance-service.mts netlify/functions/attendance.mts netlify/functions/attendance-maintenance.mts netlify/functions/schedule-v2.mts netlify/functions/work.mts tests/e2e/unified-portal.spec.mjs scripts/unified-portal-test.mjs
          git commit -m "fix: enforce strict employee kiosk [employee-kiosk-applied]"
          git push origin HEAD:fix/runtime-database-connection
