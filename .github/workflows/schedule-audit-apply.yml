name: Habun temporary encrypted roster correction

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  id-token: write

jobs:
  apply:
    if: >-
      github.repository == 'pubgsufian-afk/z.B.-mein-projekt' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 73 &&
      github.actor_id == '249184348' &&
      startsWith(github.event.comment.body, '<!-- habun-schedule-audit-envelope-v1 -->')
    runs-on: ubuntu-latest
    steps:
      - name: Apply encrypted corrections
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const marker = '<!-- habun-schedule-audit-envelope-v1 -->'
          const body = String(process.env.COMMENT_BODY || '')
          const envelope = JSON.parse(body.slice(body.indexOf(marker) + marker.length).trim())
          const oidcUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL)
          oidcUrl.searchParams.set('audience', 'habun-schedule-assistant')
          const oidcRes = await fetch(oidcUrl, { headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } })
          if (!oidcRes.ok) throw new Error(`OIDC ${oidcRes.status}`)
          const { value: oidcToken } = await oidcRes.json()
          const response = await fetch('https://habun-mitarbeiterportal.netlify.app/api/schedule-audit-oidc', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
            body: JSON.stringify({ oidcToken, envelope }),
          })
          const result = await response.json().catch(() => ({}))
          if (!response.ok) throw new Error(`Audit ${response.status}: ${JSON.stringify(result)}`)
          const safe = {
            commandId: result.commandId,
            total: result.total,
            updated: result.updated,
            deleted: result.deleted,
            notFound: result.notFound,
            ambiguous: result.ambiguous,
            failed: result.failed,
            invalid: result.invalid,
            results: Array.isArray(result.results) ? result.results.map(({ index, status, httpStatus, count }) => ({ index, status, httpStatus, count })) : [],
          }
          const path = 'ops/schedule-audit-status.json'
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json',
            'X-GitHub-Api-Version': '2022-11-28',
          }
          const existing = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/contents/${path}`, { headers })
          const writeBody = {
            message: 'chore: store roster correction status [skip ci]',
            content: Buffer.from(JSON.stringify(safe, null, 2)).toString('base64'),
          }
          if (existing.ok) writeBody.sha = (await existing.json()).sha
          const written = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/contents/${path}`, {
            method: 'PUT', headers, body: JSON.stringify(writeBody),
          })
          if (!written.ok) throw new Error(`write failed ${written.status}: ${await written.text()}`)
          NODE
