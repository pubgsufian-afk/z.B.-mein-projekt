name: Apply employee own schedule view

on:
  push:
    branches:
      - fix/runtime-database-connection

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[employee-schedule-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-database-connection
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply employee schedule view
        run: node scripts/apply-employee-schedule-view.mjs
      - name: Commit generated changes
        run: |
          git config user.name "habun-portal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/App.jsx frontend/src/styles.css netlify/functions/schedule-v2.mts scripts/employee-access-policy-test.mjs scripts/unified-portal-test.mjs tests/e2e/unified-portal.spec.mjs
          git commit -m "fix: let employees view only their own schedule [employee-schedule-applied]"
          git push origin HEAD:fix/runtime-database-connection
