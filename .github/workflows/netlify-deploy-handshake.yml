name: Secure Netlify deploy handshake

on:
  push:
    branches:
      - ops/source-bundle-20260901

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate one-time encryption key
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/netlify-deploy-private.pem 2>/dev/null
          openssl pkey -in /tmp/netlify-deploy-private.pem -pubout -out netlify-deploy-public.pem
      - name: Publish one-time public key
        uses: actions/upload-artifact@v4
        with:
          name: netlify-deploy-public-key
          path: netlify-deploy-public.pem
          retention-days: 1
          if-no-files-found: error
      - name: Receive encrypted deploy credential
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=0
          for attempt in $(seq 1 60); do
            status=$(curl -sS -L -o /tmp/netlify-proxy-api.json -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ops/netlify-proxy.enc?ref=$GITHUB_REF_NAME")
            if [ "$status" = "200" ]; then
              found=1
              break
            fi
            sleep 5
          done
          if [ "$found" != "1" ]; then
            echo "Encrypted deploy credential was not received." >&2
            exit 1
          fi
          jq -r '.content' /tmp/netlify-proxy-api.json | tr -d '\n' | base64 -d > /tmp/netlify-proxy.txt
          base64 -d /tmp/netlify-proxy.txt > /tmp/netlify-proxy.enc
          PROXY_PATH=$(openssl pkeyutl -decrypt \
            -inkey /tmp/netlify-deploy-private.pem \
            -in /tmp/netlify-proxy.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256)
          echo "::add-mask::$PROXY_PATH"
          printf '%s' "$PROXY_PATH" > /tmp/netlify-proxy-path
      - name: Deploy merged portal source once
        run: |
          PROXY_PATH=$(cat /tmp/netlify-proxy-path)
          echo "::add-mask::$PROXY_PATH"
          rm -f netlify-deploy-public.pem
          rm -f .github/workflows/netlify-deploy-handshake.yml
          npx -y @netlify/mcp@latest \
            --site-id 31fdd344-8ffd-45ff-8a4d-031c5bb879dc \
            --proxy-path "$PROXY_PATH"
