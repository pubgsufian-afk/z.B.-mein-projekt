name: Remove reports navigation branch check

on:
  push:
    branches:
      - feat/remove-reports-navigation-20260812

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Run full unified mutation/finalizer pipeline
        run: npm run verify:unified
      - name: Focused final reports navigation contract
        run: node scripts/reports-navigation-hidden-test.mjs
      - name: Full repository verification
        run: npm run verify
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        run: npm run test:e2e
