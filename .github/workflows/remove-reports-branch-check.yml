name: Remove reports navigation branch check

on:
  push:
    branches:
      - feat/remove-reports-navigation-20260812

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Prepare final portal source for focused test
        run: |
          node scripts/apply-portal-audit-fixes.mjs
          node scripts/apply-scheduler-support.mjs
          node scripts/fix-scheduler-patch-regressions.mjs
          node scripts/apply-worksite-delete-feature.mjs
          node scripts/apply-schedule-pdf-range-feature.mjs
          node scripts/apply-final-production-fixes.mjs
          node scripts/apply-employee-schedule-visibility-fix.mjs
          node scripts/apply-neon-schedule-source.mjs
          node scripts/apply-employee-schedule-stale-id-recovery.mjs
          node scripts/apply-worksite-geolocation-fix.mjs
          node scripts/apply-device-independent-geolocation-fix.mjs
          node scripts/apply-worksite-maps-clockout-feature.mjs
          node scripts/prepare-overnight-attendance-patch.mjs
          node scripts/apply-overnight-shift-attendance-fix.mjs
          node scripts/apply-attendance-schedule-source-fix.mjs
          node scripts/apply-attendance-last-schedule-display-fix.mjs
          node scripts/apply-schedule-midnight-week-fix.mjs
          node scripts/apply-schedule-command-worker.mjs
          node scripts/prepare-stundenzettel-patch.mjs
          node scripts/normalize-stundenzettel-performance-compat.mjs
          node scripts/apply-stundenzettel-feature.mjs
          node scripts/verify-timesheet-monthly-freeze.mjs
      - name: Focused final reports navigation contract
        run: node scripts/reports-navigation-hidden-test.mjs
