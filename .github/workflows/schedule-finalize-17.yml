name: Habun finalize roster correction

on:
  push:
    paths:
      - '.github/workflows/schedule-finalize-17.yml'

permissions:
  contents: write
  id-token: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Update and sync corrected shift
        env:
          UPDATE_ENVELOPE: '{"version":1,"state":"command","algorithm":"RSA-OAEP-256+A256GCM","encryptedKey":"","iv":"8JoQ+y7rcDekLlWt","ciphertext":"","tag":"QZJRkkQiS6qwHIyP9TouEw=="}'
          SYNC_ENVELOPE: '{"version":1,"state":"command","algorithm":"RSA-OAEP-256+A256GCM","encryptedKey":"","iv":"GWyaN7zqNOnGYzK1","ciphertext":"","tag":"qZVmVPnO5M71TOhBjZhdQA=="}'
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          async function oidcToken() {
            const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL)
            url.searchParams.set('audience', 'habun-schedule-assistant')
            const response = await fetch(url, { headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } })
            if (!response.ok) throw new Error(`OIDC ${response.status}`)
            return (await response.json()).value
          }
          async function call(envelope) {
            const token = await oidcToken()
            const response = await fetch('https://habun-mitarbeiterportal.netlify.app/api/schedule-oidc-trigger', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
              body: JSON.stringify({ oidcToken: token, envelope: JSON.parse(envelope) }),
            })
            const data = await response.json().catch(() => ({}))
            return { ok: response.ok, status: response.status, data }
          }
          const update = await call(process.env.UPDATE_ENVELOPE)
          if (!update.ok) throw new Error(`Update failed ${update.status}`)
          const sync = await call(process.env.SYNC_ENVELOPE)
          if (!sync.ok || Number(sync.data?.duplicateCount || 0) !== 1) {
            throw new Error(`Sync failed ${sync.status}: duplicateCount=${sync.data?.duplicateCount}`)
          }
          const safe = {
            updateOk: true,
            syncOk: true,
            duplicateCount: Number(sync.data.duplicateCount || 0),
          }
          const path = 'ops/schedule-finalize-17-status.json'
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json',
            'X-GitHub-Api-Version': '2022-11-28',
          }
          const existing = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/contents/${path}`, { headers })
          const body = { message: 'chore: store roster finalization status [skip ci]', content: Buffer.from(JSON.stringify(safe, null, 2)).toString('base64') }
          if (existing.ok) body.sha = (await existing.json()).sha
          const write = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/contents/${path}`, { method: 'PUT', headers, body: JSON.stringify(body) })
          if (!write.ok) throw new Error(`Status write failed ${write.status}`)
          NODE
