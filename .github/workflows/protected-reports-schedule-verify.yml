name: Protected reports and schedule verification

on:
  pull_request:
    branches:
      - fix-reports-live

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-reports-live-final-check-run
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check whether implementation payload is present
        id: gate
        shell: bash
        run: |
          if [ -f scripts/.reports-schedule-apply-00.b64 ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Recreate protected implementation script
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          cat scripts/.reports-schedule-apply-00.b64 scripts/.reports-schedule-apply-01.b64 scripts/.reports-schedule-apply-02.b64 scripts/.reports-schedule-apply-03.b64 | base64 -d | gunzip > /tmp/apply-reports-schedule-mobile.mjs
          node --check /tmp/apply-reports-schedule-mobile.mjs
      - name: Apply implementation
        if: steps.gate.outputs.apply == 'true'
        run: node /tmp/apply-reports-schedule-mobile.mjs
      - name: Install dependencies
        if: steps.gate.outputs.apply == 'true'
        run: npm install --no-audit --no-fund
      - name: Verify source contracts
        if: steps.gate.outputs.apply == 'true'
        run: npm run verify
      - name: Build production bundle
        if: steps.gate.outputs.apply == 'true'
        run: npm run build
      - name: Install browser
        if: steps.gate.outputs.apply == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run browser verification
        if: steps.gate.outputs.apply == 'true'
        run: npm run test:e2e
      - name: Remove one-time helper files
        if: steps.gate.outputs.apply == 'true'
        run: rm -f scripts/.reports-schedule-apply-*.b64 .github/workflows/apply-reports-schedule-mobile.yml
      - name: Commit verified implementation
        if: steps.gate.outputs.apply == 'true'
        run: |
          git config user.name "habun-portal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: repair reports and compact schedule [verified]"
          git push origin HEAD:fix-reports-live-final-check-run
      - name: Upload mobile verification
        if: always() && steps.gate.outputs.apply == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reports-schedule-mobile-preview
          path: artifacts/unified-preview
          if-no-files-found: warn
          retention-days: 7
