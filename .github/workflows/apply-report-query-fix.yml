name: Apply report query fix

on:
  push:
    branches:
      - fix-reports-live

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[report-query-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-reports-live
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-report-query-fix.mjs
      - name: Commit corrected report queries
        run: |
          git config user.name "habun-portal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/unified-reports.mts netlify/functions/reports-v2.mts
          git commit -m "fix: parameterize selected employees in reports [report-query-fixed]"
          git push origin HEAD:fix-reports-live
